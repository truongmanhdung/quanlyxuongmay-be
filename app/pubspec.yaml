name: xuong_may_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  fl_chart: ^0.69.2
  syncfusion_flutter_charts: ^27.2.5
  google_fonts: ^6.2.1
  animated_bottom_navigation_bar: ^1.4.0
  iconsax_flutter: ^1.0.1
  flutter_animate: ^4.5.0
  socket_io_client: ^3.1.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_native_splash:
  color: "#465FFF"
  image: assets/icon/icon_foreground.png
  android_12:
    image: assets/icon/icon_foreground.png
    color: "#465FFF"
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#465FFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#465FFF"
    theme_color: "#465FFF"
